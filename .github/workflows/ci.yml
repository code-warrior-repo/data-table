name: Library qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit-and-types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.23.4', '24.15.0', '26.0.0']
        react: ['18.3.1', '19.3.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run check
      - run: npm run test:package
      - run: npm audit --omit=dev --audit-level=high
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci --prefix examples/nextjs-demo --ignore-scripts
      - run: npm run build --prefix examples/nextjs-demo
      - run: npx playwright install --with-deps
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
