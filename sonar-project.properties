# Connection/project identifiers come from GitHub variables and secrets.
sonar.sources=src,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js,tests/**/*.test.jsx,tests/**/*.test.mjs,tests/types/**
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,playwright-report/**,test-results/**
# Release scripts have a separate Node test harness; LCOV covers the library source.
sonar.coverage.exclusions=scripts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
